<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>View bar</title>
<style>
  :root {
    --primary: #ff4b4b;
    --bg: #ffffff;
    --bg2: #f0f2f6;
    --text: #31333f;
    --border: rgba(49, 51, 63, 0.2);
    --muted: rgba(49, 51, 63, 0.6);
    --font: "Source Sans Pro", "Source Sans 3", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--text); font-family: var(--font); font-size: 14px; }
  body { padding: 1px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .row { display: flex; gap: 6px; align-items: stretch; }
  .seg { flex: 1 1 auto; min-width: 0; display: flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); }
  .v { flex: 1 1 auto; border: 0; background: none; color: var(--muted); border-radius: 6px; padding: 4px 10px; white-space: nowrap;
       display: grid; align-content: center; justify-items: center; line-height: 1.25; font-weight: 500; }
  .v:hover { color: var(--text); }
  .v[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .v.add { flex: 0 0 auto; color: var(--primary); font-size: 17px; font-weight: 600; padding: 0 12px; }
  .v small { font-size: 11px; font-weight: 400; color: var(--muted); }
  .v .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); margin-right: 6px; vertical-align: middle; }
  .btn { flex: none; border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 0 12px; white-space: nowrap; }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .icon { width: 38px; padding: 0; font-size: 16px; display: grid; place-items: center; }
  .more { position: relative; flex: none; display: flex; }
  .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; min-width: 260px; max-width: 90vw; background: var(--bg); border: 1px solid var(--border);
          border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.15); padding: 6px; display: grid; gap: 1px; }
  .menu .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 8px 2px; }
  .menu button { border: 0; background: none; text-align: left; border-radius: 6px; padding: 6px 8px; display: grid; }
  .menu button:hover { background: var(--bg2); }
  .menu button[aria-current="true"] { color: var(--primary); }
  .menu button small { color: var(--muted); font-size: 12px; }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; width: 100%; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), '*'); }
  function setValue(value) { send('streamlit:setComponentValue', { value: Object.assign({ nonce: Date.now() + Math.random() }, value), dataType: 'json' }); }
  var lastHeight = -1;
  function syncHeight() {
    var menu = app.querySelector('.menu');
    var h = Math.ceil(app.getBoundingClientRect().height + 2 + (menu ? menu.getBoundingClientRect().height + 6 : 0));
    if (h !== lastHeight) { lastHeight = h; send('streamlit:setFrameHeight', { height: h }); }
  }
  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'class') el.className = attrs[k];
      else if (k === 'text') el.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    });
    (children || []).forEach(function (ch) { if (ch) el.appendChild(typeof ch === 'string' ? document.createTextNode(ch) : ch); });
    return el;
  }

  var app = document.getElementById('app');
  var cfg = null, current = null, menuOpen = false;

  function pick(name) {
    menuOpen = false;
    if (name !== current) { current = name; setValue({ action: 'pick', view: name }); }
    render();
  }
  function count(v) { var n = 0; v.rows.forEach(function (r) { n += r.length; }); return n; }
  function segment(v, detail) {
    var b = h('button', { class: 'v', 'aria-pressed': String(v.name === current), title: v.label + (v.help ? ' · ' + v.help : ''), onclick: function () { pick(v.name); } }, [
      h('span', null, [v.preset ? null : h('span', { class: 'dot' }), v.label])
    ]);
    if (detail) b.appendChild(h('small', { text: count(v) + (count(v) === 1 ? ' panel' : ' panels') }));
    return b;
  }

  function build(list, detail, hidden) {
    function seg(views, name, add) {
      var kids = views.map(function (v) { return segment(v, detail); });
      if (add) kids.push(h('button', { class: 'v add', title: 'New view, starting from this one', 'aria-label': 'New view', onclick: function () { setValue({ action: 'edit', new_view: true }); } }, ['+']));
      return h('div', { class: 'seg', role: 'group', 'aria-label': name, style: 'flex-grow:' + Math.max(1, kids.length) }, kids);
    }
    // One control: the ready-made views and the user's own in their order, then +
    var segs = [seg(list, cfg.label || 'View', true)], kids = segs;
    var moreBtn = h('button', { class: 'btn', 'aria-haspopup': 'true', 'aria-expanded': String(menuOpen),
                                onclick: function (ev) { ev.stopPropagation(); menuOpen = !menuOpen; render(); } },
                    [(hidden.length ? 'More (' + hidden.length + ')' : 'More') + ' ▾']);
    var more = h('div', { class: 'more' }, [moreBtn]);
    var row = h('div', { class: 'row' }, kids.concat([more,
      h('button', { class: 'btn icon', title: cfg.customize_help || 'Customize views', 'aria-label': cfg.customize_help || 'Customize views', onclick: function () { setValue({ action: 'edit' }); } }, ['✏️'])
    ]).concat((cfg.actions || []).map(function (a) {
      return h('button', { class: 'btn' + (a.icon && !a.label ? ' icon' : ''), title: a.help || a.label || '', 'aria-label': a.help || a.label || a.id,
                           onclick: function () { setValue({ action: 'button', id: a.id }); } }, [a.icon && !a.label ? a.icon : (a.icon ? a.icon + ' ' : '') + (a.label || '')]);
    })));
    return { row: row, segs: segs, more: more };
  }
  function fits(parts) {
    return parts.row.scrollWidth <= parts.row.clientWidth + 1 &&
      parts.segs.every(function (sg) { return sg.scrollWidth <= sg.clientWidth + 1; });
  }

  function render() {
    if (!cfg) return;
    var bar = cfg.views.filter(function (v) { return v.in_bar || v.name === current; });
    var onlyMore = cfg.views.filter(function (v) { return !v.in_bar && v.name !== current; });
    // Try the roomiest form first: details, then group labels, then plain names
    var modes = cfg.details ? [[true], [false]] : [[false]];
    var parts = null, hidden = [];
    for (var i = 0; i < modes.length; i++) {
      parts = build(bar, modes[i][0], onlyMore); app.replaceChildren(parts.row);
      if (fits(parts)) break;
      parts = null;
    }
    if (!parts) {
      // Move views into More from the end of the bar, never the current one
      var shown = bar.slice();
      while (shown.length > 1) {
        var idx = -1;
        for (var j = shown.length - 1; j >= 0; j--) if (shown[j].name !== current) { idx = j; break; }
        if (idx < 0) break;
        hidden.unshift(shown.splice(idx, 1)[0]);
        parts = build(shown, false, hidden.concat(onlyMore)); app.replaceChildren(parts.row);
        if (fits(parts)) break;
      }
      if (!parts) { parts = build(shown, false, hidden.concat(onlyMore)); app.replaceChildren(parts.row); }
    }
    var inMore = hidden.concat(onlyMore);
    if (menuOpen) {
      var menu = h('div', { class: 'menu', role: 'menu' });
      function item(v) {
        return h('button', { role: 'menuitem', 'aria-current': String(v.name === current), onclick: function () { pick(v.name); } },
                 [h('span', { text: v.label }), h('small', { text: v.help || (count(v) + ' panels' + (v.preset ? '' : ' · yours')) })]);
      }
      var ready = inMore.filter(function (v) { return v.preset; }), mine = inMore.filter(function (v) { return !v.preset; });
      if (ready.length) { menu.appendChild(h('div', { class: 'grp', text: 'Ready-made views' })); ready.forEach(function (v) { menu.appendChild(item(v)); }); }
      if (mine.length) { menu.appendChild(h('div', { class: 'grp', text: 'Your views' })); mine.forEach(function (v) { menu.appendChild(item(v)); }); }
      if (!inMore.length) menu.appendChild(h('div', { class: 'grp', text: 'All views are in the bar' }));
      menu.appendChild(h('hr'));
      menu.appendChild(h('button', { role: 'menuitem', onclick: function () { menuOpen = false; setValue({ action: 'edit' }); render(); } },
        [h('span', { text: 'Manage views' }), h('small', { text: 'Order, rename, duplicate or delete views' })]));
      parts.more.appendChild(menu);
    }
    syncHeight();
  }

  document.addEventListener('click', function (ev) { if (menuOpen && !ev.target.closest('.more')) { menuOpen = false; render(); } });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && menuOpen) { menuOpen = false; render(); } });

  window.addEventListener('message', function (ev) {
    var data = ev.data;
    if (!data || data.type !== 'streamlit:render') return;
    var theme = data.theme;
    if (theme) {
      var s = document.documentElement.style;
      if (theme.primaryColor) s.setProperty('--primary', theme.primaryColor);
      if (theme.backgroundColor) s.setProperty('--bg', theme.backgroundColor);
      if (theme.secondaryBackgroundColor) s.setProperty('--bg2', theme.secondaryBackgroundColor);
      if (theme.textColor) {
        s.setProperty('--text', theme.textColor);
        s.setProperty('--border', 'color-mix(in srgb, ' + theme.textColor + ' 20%, transparent)');
        s.setProperty('--muted', 'color-mix(in srgb, ' + theme.textColor + ' 60%, transparent)');
      }
      if (theme.font) s.setProperty('--font', theme.font);
    }
    cfg = data.args;
    current = cfg.current;
    render();
  });
  var lastWidth = 0;
  new ResizeObserver(function () {
    var w = document.body.clientWidth;
    if (w !== lastWidth) { lastWidth = w; render(); }
  }).observe(document.body);
  send('streamlit:componentReady', { apiVersion: 1 });
})();
</script>
</body>
</html>
