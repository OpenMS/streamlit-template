[browser]
gatherUsageStats = false

[global]
developmentMode = false

[secrets]
# Kubernetes mounts the optional `streamlit-secrets` Secret at /app/admin-secrets/;
# the default locations are kept so local `streamlit run` picks up ./.streamlit/secrets.toml.
files = ["/app/admin-secrets/secrets.toml", "~/.streamlit/secrets.toml", ".streamlit/secrets.toml"]

[server]
address = "0.0.0.0"
maxUploadSize =  200 #MB
port = 8501 # should be same as configured in deployment repo


[theme]
# Theme settings shared by the light and dark theme go here (font, radius, ...).
# Do not set "base": a base pins the app to that theme and removes the
# light/dark choice. With both [theme.light] and [theme.dark] defined, the app
# follows the operating system's color scheme, and users can switch in the
# app menu (⋮ → Settings → "Choose app theme").

[theme.light]
# Primary accent color for interactive elements.
primaryColor = "#29379b"

[theme.dark]
# Lighter shade of the OpenMS blue, readable on the dark background.
primaryColor = "#7d8ce8"
