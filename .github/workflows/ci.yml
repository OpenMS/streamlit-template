name: continuous-integration

# Branch pushes are covered by their PR; running on every push ran each PR twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a PR cancels its running checks. Pushes to main queue, and
# GitHub keeps only the newest waiting run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reads the repository only; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # The oldest Python the app supports. The full Docker images use 3.11
        # (pyOpenMS 3.6 needs it), the desktop apps 3.11 too.
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt # test with requirements file so can easily bump with dependabot
        pip install pytest fakeredis
    - name: Test
      run: |
        python -m pytest test_gui.py tests/

