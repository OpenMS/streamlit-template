name: continuous-integration

# Branch pushes are covered by their PR; running on every push ran each PR twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a PR cancels its running checks. Pushes to main queue, and
# GitHub keeps only the newest waiting run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reads the repository only; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # The oldest Python the app supports. The full Docker images use 3.11
        # (pyOpenMS 3.6 needs it), the desktop apps 3.11 too.
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt # test with requirements file so can easily bump with dependabot
        pip install pytest fakeredis polars
    - name: Test
      run: |
        python -m pytest test_gui.py tests/

