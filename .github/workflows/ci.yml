name: continuous-integration

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # The oldest Python the app supports. The full Docker images use 3.11
        # (pyOpenMS 3.6 needs it), the desktop apps 3.11 too.
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt # test with requirements file so can easily bump with dependabot
        pip install pytest fakeredis
    - name: Test
      run: |
        python -m pytest test_gui.py tests/

