name: Test workflow functions

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A newer push to a PR cancels its running checks. Pushes to main queue, and
# GitHub keeps only the newest waiting run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reads the repository only; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - name: Read ci.example_workflow_tests from app.yaml
      id: gate
      run: |
        run=true
        if [ -f app.yaml ] && [ "$(yq '.ci.example_workflow_tests' app.yaml | tr '[:upper:]' '[:lower:]')" = false ]; then
          run=false
          echo "ci.example_workflow_tests is false in app.yaml: skipped" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "run=$run" >> "$GITHUB_OUTPUT"
    - if: steps.gate.outputs.run == 'true'
      name: Set up Python
      uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 # v3.1.4
      with:
        python-version: "3.11"
    - if: steps.gate.outputs.run == 'true'
      name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    - if: steps.gate.outputs.run == 'true'
      name: Running test cases
      run: |
        pytest test.py
    - if: steps.gate.outputs.run == 'true'
      name: Running GUI tests
      run: |
        pytest test_gui.py
