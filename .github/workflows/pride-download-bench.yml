# Temporary: measures PRIDE download speed from a GitHub runner. Removed before merge.
name: pride-download-bench
on:
  pull_request:
    paths: [".github/workflows/pride-download-bench.yml", "src/data_import/**"]
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - name: Raw streams (MB/s with 1, 2, 4, 8 parallel range requests, 30 s each)
        run: |
          cat > /tmp/streams.py <<'PY'
          import sys, time, threading, requests
          U = "https://ftp.pride.ebi.ac.uk/pride/data/archive/2012/03/PXD000001/TMT_Erwinia_1uLSike_Top10HCD_isol2_45stepped_60min_01.raw"
          for n in (1, 2, 4, 8):
              got, errs = [0] * n, []
              def w(i):
                  try:
                      with requests.get(U, headers={"Range": f"bytes={i*27_000_000}-{(i+1)*27_000_000-1}"}, stream=True, timeout=60) as r:
                          for c in r.iter_content(256 * 1024):
                              got[i] += len(c)
                              if time.monotonic() - T0 > 30: break
                  except Exception as e: errs.append(type(e).__name__)
              T0 = time.monotonic()
              ts = [threading.Thread(target=w, args=(i,)) for i in range(n)]
              [t.start() for t in ts]; [t.join() for t in ts]
              el = time.monotonic() - T0
              print(f"{n} streams: {sum(got)/1e6/el:.2f} MB/s, per stream {[round(g/1e6/el,2) for g in got]}, errors {errs}", flush=True)
          PY
          python /tmp/streams.py
      - name: Import of a 220 MB PRIDE file (one connection, then eight)
        run: |
          cat > /tmp/imp.py <<'PY'
          import sys, time, shutil
          from pathlib import Path
          sys.path.insert(0, ".")
          from src.data_import import job, net, sources
          for conn in (1, 8):
              out = Path("/tmp/bench") / f"c{conn}"
              s = net.make_session(guard=True)
              t0 = time.time(); listing = sources.resolve(s, "PXD000001"); tl = time.time() - t0
              T = {"mzML-files": {"name": "MS", "file_types": ["raw"], "dir": str(out / "in"), "fallback": []}}
              items = [i for i in job.build_items(listing.files, T) if i["name"].endswith(".raw")]
              t0 = time.time()
              st = job.run_import(str(out / "job"), items, T, guard=True, connections=conn)
              td = time.time() - t0
              mb = sum(i["size"] for i in items) / 1e6
              print(f"connections={conn}: listing {tl:.1f} s, {mb:.0f} MB in {td:.0f} s = {mb/td:.2f} MB/s, {st['state']} {st['errors']}", flush=True)
              shutil.rmtree(out)
          PY
          python /tmp/imp.py
