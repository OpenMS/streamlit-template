name: Build desktop app
# One run builds the Electron app for Windows, macOS (Apple Silicon) and Linux,
# and a release gets all installers attached.
#
# The macOS job takes 35-45 minutes on a runner pool shared by every OpenMS
# repository, so the full build runs only where it can find something new:
#   release, manual run   always
#   nightly               when main moved since the last successful build
#   pull request          when it changes packaging (electron/, this workflow,
#                         openms.yml, requirements, settings.json, app.py) or
#                         carries the label `desktop-build`
# The `scope` job decides; when it says no, the run ends in seconds.
on:
  pull_request:
    branches: [ "main" ]
    types: [opened, reopened, synchronize, labeled]
  schedule:
    - cron: "41 2 * * *"   # nightly, 02:41 UTC
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      openms:
        description: 'OpenMS for this run: a release ("3.5.0") or "[owner/repo@]ref" to build. Empty uses the default below.'
        type: string
        default: ""

permissions:
  contents: read

# A newer push to a PR cancels its running build. Other refs queue, and GitHub
# keeps only the newest waiting run, so superseded runs never reach a runner.
# Adding some other label to a PR gets a group of its own, so it never cancels
# a build that is running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'desktop-build' && '-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Name of the app and its installers
  APP_NAME: OpenMS-StreamlitTemplateApp
  # Define needed TOPP tools here. FileConverter converts Thermo .raw input
  # (CommandExecutor.convert_to_mzml) with share/OpenMS/THIRDPARTY/ThermoRawFileParser.
  TOPP_TOOLS: "FeatureFinderMetabo FeatureLinkerUnlabeledKD SiriusExport FileConverter"

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ACTION: ${{ github.event.action }}
          ADDED: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          run=false
          case "$EVENT" in
            release|workflow_dispatch) run=true ;;
            schedule)
              head=$GITHUB_SHA
              last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-desktop-app.yaml/runs?status=success&per_page=20" \
                       --jq '[.workflow_runs[] | select(.event != "pull_request")][0].head_sha // ""')
              [ "$head" != "$last" ] && run=true || echo "main unchanged since the last successful build"
              ;;
            pull_request)
              if [ "$ACTION" = labeled ] && [ "$ADDED" != desktop-build ]; then
                echo "label $ADDED does not ask for a desktop build"
              elif echo "$LABELS" | grep -q '"desktop-build"'; then
                run=true
              elif files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') &&
                   printf '%s\n' "$files" | grep -Eq '^(electron/|\.github/workflows/(build-desktop-app\.yaml|openms\.yml)$|requirements[^/]*\.txt$|settings\.json$|app\.py$)'; then
                run=true
              else
                echo "no packaging change; add the label desktop-build to build anyway"
              fi
              ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "desktop build: $run" >> "$GITHUB_STEP_SUMMARY"

  # Release or build? A released OpenMS ("3.5.0") is downloaded by the build
  # job's "Stage OpenMS TOPP tools" step on every platform, and this job only
  # takes seconds. A branch, tag or commit ("OpenMS/OpenMS@develop",
  # "t0mdavid-m/OpenMS@FDmerge") is built here on all three platforms, once
  # per commit: later runs of the same commit restore the cached packages.
  openms:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    uses: ./.github/workflows/openms.yml
    with:
      openms: ${{ inputs.openms || '3.5.0' }}

  # One job for all three platforms: the same steps stage OpenMS, Python and
  # the app into electron/payload, then a single packaging step turns it into
  # this platform's installer, which the same test steps install and drive.
  build:
    name: ${{ matrix.platform }}
    needs: openms
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows-x86_64
            runs-on: windows-2022
          # Apple Silicon only; Intel Macs are not supported.
          - platform: macOS-arm64
            runs-on: macos-15
          # Built on the Ubuntu the OpenMS .deb was built for (22.04 up to
          # OpenMS 3.5, 24.04 from 3.6), whose glibc the bundle then needs.
          - platform: Linux-x86_64
            runs-on: linux
    runs-on: ${{ matrix.runs-on == 'linux' && needs.openms.outputs.linux-runner || matrix.runs-on }}
    # Signing takes minutes now that bytecode and data files are skipped
    # (mac.signIgnore), but took hours before; the limit leaves room for
    # the timestamp-service rebuilds and for an app with a larger payload.
    timeout-minutes: 300
    defaults:
      run:
        # Git Bash on Windows, so every step is the same script everywhere.
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      # Minor version; the latest patch release from python-build-standalone is used.
      PYTHON_VERSION: "3.11"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set version and offline deployment in settings.json
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        # Only release builds carry a tag; other builds keep settings.json's version.
        jq --arg v "$RELEASE_TAG" \
          '.online_deployment = false | if $v != "" then .version = $v else . end' \
          settings.json > settings.tmp && mv settings.tmp settings.json

    - name: Download the OpenMS build
      if: needs.openms.outputs.source == 'build'
      uses: actions/download-artifact@v4
      with:
        name: openms-${{ matrix.platform }}
        path: openms-package

    - name: Stage OpenMS TOPP tools
      # A release: its Windows installer, arm64 .pkg (already self-contained)
      # or .deb (its system libraries are bundled). A build: the package above.
      env:
        OPENMS_VERSION: ${{ needs.openms.outputs.version }}
        OPENMS_REPOSITORY: ${{ needs.openms.outputs.repository }}
      run: |
        if [[ -d openms-package ]]; then
          export OPENMS_PACKAGE
          OPENMS_PACKAGE=$(find openms-package -maxdepth 1 -type f | head -n 1)
        fi
        electron/scripts/stage-openms.sh "$OPENMS_VERSION" electron/payload $TOPP_TOOLS

    - name: Stage Python with the app's requirements
      run: electron/scripts/stage-python.sh "$PYTHON_VERSION" electron/payload requirements.txt

    - name: Copy the app into the payload
      run: |
        p=electron/payload
        cp -R src utils content docs assets example-data .streamlit app.py settings.json default-parameters.json "$p/"
        # The local server only listens on loopback; the shell passes the address.
        grep -v '^address' "$p/.streamlit/config.toml" > config.tmp && mv config.tmp "$p/.streamlit/config.toml"
        # Read-only on macOS and Linux (see stage-python.sh), so compile now.
        if [[ $RUNNER_OS != Windows ]]; then
          "$p/python-$PYTHON_VERSION/bin/python3" -m compileall -q --invalidation-mode unchecked-hash "$p/src" "$p/utils"
        fi
        du -sh "$p"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: electron/package-lock.json

    - name: Install Electron dependencies
      # Separate from packaging, so dependency install scripts never see the
      # signing secrets.
      working-directory: electron
      run: npm ci

    - name: Package installer
      # The only platform-specific step: NSIS on Windows, a signed and
      # notarized dmg on macOS, an AppImage on Linux (electron/scripts/package.sh).
      id: package
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: electron/scripts/package.sh

    - name: Install the app
      # Silent install (Windows), mounted dmg with signature checks (macOS),
      # extracted AppImage (Linux); sets APP_EXE, APP_PAYLOAD, APP_LOG, E2E_EXE.
      env:
        INSTALLER: ${{ steps.package.outputs.installer }}
        SIGNED: ${{ secrets.MACOS_CERTIFICATE != '' }}
        NOTARIZED: ${{ secrets.APPLE_API_KEY != '' || secrets.APPLE_ID != '' }}
      run: electron/scripts/install-app.sh "$INSTALLER"

    - name: Smoke test the installed payload
      # pyOpenMS, every TOPP tool and the Streamlit server, with the shell's environment.
      run: node electron/scripts/smoke-payload.js "$APP_PAYLOAD" $TOPP_TOOLS

    - name: Smoke test the app
      # Launches the app, which exits 0 once the page has created a workspace.
      run: |
        run=""
        if [[ $RUNNER_OS == Linux ]]; then run="xvfb-run -a"; fi
        $run node electron/scripts/smoke-app.js "$APP_EXE" "$APP_LOG" --timeout 300

    - name: End-to-end test in the app window
      timeout-minutes: 120
      # Drives the installed app with Playwright and opens every page; an app
      # adds its own steps (run a workflow, check its results) with --scenario.
      run: |
        run=""
        if [[ $RUNNER_OS == Linux ]]; then run="xvfb-run -a"; fi
        $run node electron/scripts/e2e.js --exe "$E2E_EXE" --out e2e-output && code=0 || code=$?
        tail -n 200 "$APP_LOG" || true
        exit $code

    - name: Archive end-to-end screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: electron-e2e-screenshots-${{ matrix.platform }}
        path: e2e-output
        if-no-files-found: ignore

    - name: Archive installer
      uses: actions/upload-artifact@v4
      with:
        name: OpenMS-App-${{ matrix.platform }}
        path: ${{ steps.package.outputs.installer }}
        if-no-files-found: error

  # Only this job can write to the repository; the build jobs run third-party
  # code (pip, npm, electron-builder) with a read-only token.
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download installers
      uses: actions/download-artifact@v4
      with:
        pattern: OpenMS-App-*
        merge-multiple: true
        path: dist

    - name: Upload installers as release assets
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: gh release upload "$RELEASE_TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
