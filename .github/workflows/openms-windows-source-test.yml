# TEMPORARY -- removed before the PR is ready for review.
# Exercises source mode of openms-windows.yml against OpenMS develop on this
# branch only, to measure cold and warm timings. Not part of any PR run.
name: OpenMS for Windows (source mode test)
on:
  push:
    branches: [ "claude/openms-windows-reusable-workflow" ]
    paths: [ ".github/workflows/openms-windows-source-test.yml" ]

jobs:
  source:
    uses: ./.github/workflows/openms-windows.yml
    with:
      mode: source
      openms-ref: develop
      topp-tools: "FeatureFinderMetabo FeatureLinkerUnlabeledKD SiriusExport"
      artifact-name: openms-package-source
