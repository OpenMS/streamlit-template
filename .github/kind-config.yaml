kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Two-node cluster that mirrors the production memory-tier topology, so the
# kind jobs pass whichever tier an app selects in its overlay
# (memory-tier-low or memory-tier-high). Every pod is pinned to one node
# through the tier's nodeSelector, because the workspace volume is a single
# ReadWriteOnce claim; without both labels, flipping the overlay would leave
# the pods Pending.
nodes:
  - role: control-plane
    # Multi-node kind clusters taint the control-plane with
    # node-role.kubernetes.io/control-plane:NoSchedule. Clear it so app pods
    # with nodeSelector memory-tier=low can land here.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          taints: []
    labels:
      openms.de/memory-tier: low
      # ingress-ready is required by the kind variant of the
      # ingress-nginx deploy manifest applied in CI.
      ingress-ready: "true"
  - role: worker
    labels:
      openms.de/memory-tier: high
