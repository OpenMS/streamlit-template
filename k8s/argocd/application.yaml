# Argo CD Application: keeps the cluster equal to k8s/overlays/prod on
# `main`, with the image tag the ImageUpdater sets. Itself synced from git
# by `streamlit-template-argocd` (argocd-application.yaml); bootstrap in
# kustomization.yaml.
#
# First deployment on a cluster that already runs the app: remove the
# `automated` block, check `argocd app diff streamlit-template`, sync once by
# hand, then merge this file unchanged.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: streamlit-template
  namespace: argocd
  annotations:
    # Never pruned or deleted by the parent: losing it would stop deploys.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: default
  source:
    repoURL: https://github.com/OpenMS/streamlit-template.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: openms
  # The admin password is patched into this Secret on the cluster; without
  # this, self-heal would reset it to the empty value from git.
  ignoreDifferences:
    - kind: Secret
      name: template-app-streamlit-secrets
      namespace: openms
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    # Argo CD makes one automatic sync attempt per commit (or image change).
    # Without retry, a failed attempt - a webhook timeout, a pod that briefly
    # does not fit - leaves the app OutOfSync until the next change.
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
