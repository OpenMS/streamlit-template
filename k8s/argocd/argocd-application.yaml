# Syncs k8s/argocd/ (this file included) into the argocd namespace, so the
# app's Application and ImageUpdater follow git like the app itself does.
# Created once by the bootstrap in kustomization.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: streamlit-template-argocd
  namespace: argocd
  annotations:
    # Removing or renaming this file must not delete the Application that
    # keeps the deployment updated; clean up by hand instead.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: default
  source:
    repoURL: https://github.com/OpenMS/streamlit-template.git
    targetRevision: main
    path: k8s/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # The ImageUpdater deploys a release by setting
  # `.spec.source.kustomize.images` on the app's Application (write-back
  # `argocd`). That field is not in git, so without this self-heal would
  # undo every update.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: streamlit-template
      namespace: argocd
      jqPathExpressions:
        - .spec.source.kustomize
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
