# Helm values for csi-driver-nfs 4.11.0, used only as the node plugin that
# openstack-manila-csi forwards NFS mounts to.

# Manila provisions the shares, so csi-driver-nfs's own provisioner has
# nothing to do. Scaled to zero rather than left idle.
controller:
  replicas: 0

# No StorageClass from this chart: the class apps claim is the Manila one in
# storageclass.yaml.
storageClass:
  create: false

externalSnapshotter:
  enabled: false
