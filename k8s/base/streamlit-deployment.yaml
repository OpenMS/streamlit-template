apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  labels:
    component: streamlit
spec:
  replicas: 2
  selector:
    matchLabels:
      component: streamlit
  template:
    metadata:
      labels:
        component: streamlit
    spec:
      initContainers:
        # The seeding logic lives in docker/seed-demos.sh, not inline here, so
        # that tests/test_seed_demos.py executes the script the image ships.
        # It stages the copy in a private directory and renames it into place -
        # rename(2) on a directory is atomic and fails on a non-empty target,
        # so with replicas: 2 the winner renames and the loser stands down.
        #
        # The script bounds itself with `timeout` and always exits 0: this
        # container gates pod start on the shared workspaces mount, and a pod
        # held in Init by a slow or restarting NFS server would defeat the
        # point of Streamlit being able to serve through a storage outage.
        - name: seed-demos
          image: openms-streamlit
          imagePullPolicy: Always
          securityContext:
            # Root in the image (TOPP tools, conda env), but without the extra
            # rights a container gets by default. The file capabilities keep
            # access to workspace files of other owners on the shared volume.
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          command: ["/bin/sh", "/app/docker/seed-demos.sh"]
          args:
            - /app/example-data/workspaces
            - /workspaces-streamlit-template/.demos
          env:
            # Wall clock for the whole seeding run, copy and stat calls alike.
            - name: SEED_TIMEOUT
              value: "300"
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces-streamlit-template
              # A FUSE volume (JuiceFS, components/storage-s3) whose mount
              # process restarted is mounted again on the node; HostToContainer
              # lets that new mount reach this running container instead of
              # leaving it on the dead one ("Transport endpoint is not
              # connected"). Harmless on NFS.
              mountPropagation: HostToContainer
      containers:
        - name: streamlit
          image: openms-streamlit
          imagePullPolicy: Always
          securityContext:
            # Root in the image (TOPP tools, conda env), but without the extra
            # rights a container gets by default. The file capabilities keep
            # access to workspace files of other owners on the shared volume.
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              source /root/miniforge3/bin/activate streamlit-env
              jq -s '.[0] * .[1]' /app/settings.json /app/settings-overrides.json > /tmp/settings-merged.json && mv /tmp/settings-merged.json /app/settings.json
              exec streamlit run app.py --server.address 0.0.0.0
          ports:
            - containerPort: 8501
          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: WORKSPACES_DIR
              value: "/workspaces-streamlit-template"
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces-streamlit-template
              # A FUSE volume (JuiceFS, components/storage-s3) whose mount
              # process restarted is mounted again on the node; HostToContainer
              # lets that new mount reach this running container instead of
              # leaving it on the dead one ("Transport endpoint is not
              # connected"). Harmless on NFS.
              mountPropagation: HostToContainer
            - name: config
              mountPath: /app/settings-overrides.json
              subPath: settings-overrides.json
              readOnly: true
            - name: admin-secrets
              mountPath: /app/admin-secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          # The HTTP check as before, plus a restart when the workspace mount
          # is dead (ENOTCONN, a FUSE mount whose process died). Slow or
          # blocked NFS does not fail it: `--mount-alive` gives up on a stat
          # that does not answer within 5s and leaves that to readiness.
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  set -u
                  curl -fsS -m 5 -o /dev/null http://localhost:8501/_stcore/health || exit 1
                  timeout -k 3 15 /root/miniforge3/envs/streamlit-env/bin/python -m src.workflow.health --mount-alive
                  # Only exit 1 is a dead mount. An image older than these
                  # manifests does not know --mount-alive and exits 2: alive.
                  [ "$?" -ne 1 ]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 3
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: workspaces-manila-pvc
        - name: config
          configMap:
            name: streamlit-config
        - name: admin-secrets
          secret:
            secretName: streamlit-secrets
            optional: true
