apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  labels:
    component: streamlit
spec:
  replicas: 2
  selector:
    matchLabels:
      component: streamlit
  template:
    metadata:
      labels:
        component: streamlit
    spec:
      initContainers:
        # Hands the workspace volume to the app's user (uid 1000), once. The
        # app containers run as that user, and files written while they ran
        # as root are still root's. The top folder is chowned last, so its
        # owner says the hand-over is done and later starts only stat it; a
        # stat that does not answer (storage outage) skips the step rather
        # than holding the pod in Init. Only this container keeps root, with
        # the capabilities to change owners and nothing else. Both init
        # containers set requests == limits, so the rq-worker pod keeps
        # Guaranteed QoS.
        - name: own-workspaces
          image: openms-streamlit
          imagePullPolicy: Always
          securityContext:
            # Root, while the image itself runs as the app's user.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              root=/workspaces-streamlit-template
              owner=$(timeout 20 stat -c %u "$root") || exit 0
              [ "$owner" = 1000 ] && exit 0
              # A walk that fails or stalls exits non-zero with the top folder
              # still root's, so the container restarts and goes on with what
              # is left; the old pods keep serving meanwhile.
              timeout -k 10 1800 find "$root" -mindepth 1 ! -uid 1000 -exec chown -h 1000:1000 {} + || exit 1
              chown 1000:1000 "$root"
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces-streamlit-template
              mountPropagation: HostToContainer
        # settings.json of the image with the deployment's overrides, written
        # to a volume the app container mounts over /app/settings.json, so the
        # app's user needs no write access to /app.
        - name: settings
          image: openms-streamlit
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          command: ["/bin/sh", "-c"]
          args:
            - jq -s '.[0] * .[1]' /app/settings.json /app/settings-overrides.json > /settings/settings.json
          volumeMounts:
            - name: config
              mountPath: /app/settings-overrides.json
              subPath: settings-overrides.json
              readOnly: true
            - name: settings
              mountPath: /settings
        # The seeding logic lives in docker/seed-demos.sh, not inline here, so
        # that tests/test_seed_demos.py executes the script the image ships.
        # It stages the copy in a private directory and renames it into place -
        # rename(2) on a directory is atomic and fails on a non-empty target,
        # so with replicas: 2 the winner renames and the loser stands down.
        #
        # The script bounds itself with `timeout` and always exits 0: this
        # container gates pod start on the shared workspaces mount, and a pod
        # held in Init by a slow or restarting NFS server would defeat the
        # point of Streamlit being able to serve through a storage outage.
        - name: seed-demos
          image: openms-streamlit
          imagePullPolicy: Always
          securityContext:
            # The app's user, not root: the image's TOPP tools and conda env
            # are readable by any user, and the workspace volume is handed to
            # uid 1000 by the own-workspaces init container.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "/app/docker/seed-demos.sh"]
          args:
            - /app/example-data/workspaces
            - /workspaces-streamlit-template/.demos
          env:
            # Wall clock for the whole seeding run, copy and stat calls alike.
            - name: SEED_TIMEOUT
              value: "300"
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces-streamlit-template
              # A FUSE volume (JuiceFS, components/storage-s3) whose mount
              # process restarted is mounted again on the node; HostToContainer
              # lets that new mount reach this running container instead of
              # leaving it on the dead one ("Transport endpoint is not
              # connected"). Harmless on NFS.
              mountPropagation: HostToContainer
      containers:
        - name: streamlit
          image: openms-streamlit
          imagePullPolicy: Always
          securityContext:
            # The app's user, not root: the image's TOPP tools and conda env
            # are readable by any user, and the workspace volume is handed to
            # uid 1000 by the own-workspaces init container.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              source /root/miniforge3/bin/activate streamlit-env
              exec streamlit run app.py --server.address 0.0.0.0
          ports:
            - containerPort: 8501
          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: WORKSPACES_DIR
              value: "/workspaces-streamlit-template"
            # Caches and config the tools write to their home folder.
            - name: HOME
              value: "/tmp"
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces-streamlit-template
              # A FUSE volume (JuiceFS, components/storage-s3) whose mount
              # process restarted is mounted again on the node; HostToContainer
              # lets that new mount reach this running container instead of
              # leaving it on the dead one ("Transport endpoint is not
              # connected"). Harmless on NFS.
              mountPropagation: HostToContainer
            - name: config
              mountPath: /app/settings-overrides.json
              subPath: settings-overrides.json
              readOnly: true
            - name: settings
              mountPath: /app/settings.json
              subPath: settings.json
              readOnly: true
            - name: admin-secrets
              mountPath: /app/admin-secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          # The HTTP check as before, plus a restart when the workspace mount
          # is dead (ENOTCONN, a FUSE mount whose process died). Slow or
          # blocked NFS does not fail it: `--mount-alive` gives up on a stat
          # that does not answer within 5s and leaves that to readiness.
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  set -u
                  curl -fsS -m 5 -o /dev/null http://localhost:8501/_stcore/health || exit 1
                  timeout -k 3 15 /root/miniforge3/envs/streamlit-env/bin/python -m src.workflow.health --mount-alive
                  # Only exit 1 is a dead mount. An image older than these
                  # manifests does not know --mount-alive and exits 2: alive.
                  [ "$?" -ne 1 ]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 3
      volumes:
        - name: settings
          emptyDir: {}
        - name: workspaces
          persistentVolumeClaim:
            claimName: workspaces-manila-pvc
        - name: config
          configMap:
            name: streamlit-config
        - name: admin-secrets
          secret:
            secretName: streamlit-secrets
            optional: true
