apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
type: Opaque
stringData:
  # Password for this app's Redis. Empty = no password (Redis is still only
  # reachable from this app's pods, see redis-networkpolicy.yaml). Never commit
  # a value: set it on the cluster, then restart Redis and its clients:
  #   kubectl -n openms patch secret <prefix>-redis-auth --type=merge \
  #     -p "{\"stringData\":{\"password\":\"$(openssl rand -hex 32)\"}}"
  #   kubectl -n openms rollout restart deployment/<prefix>-redis \
  #     deployment/<prefix>-streamlit deployment/<prefix>-rq-worker deployment/<prefix>-sync
  # See docs/kubernetes-deployment.md, "Configuring the Redis password".
  password: ""
