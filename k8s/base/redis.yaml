apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      component: redis
  template:
    metadata:
      labels:
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.12-alpine
          # The image's entrypoint is kept (it drops to the redis user); the
          # password, when the redis-auth Secret has one, is passed to it.
          args:
            - sh
            - -c
            - exec docker-entrypoint.sh redis-server ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
                  optional: true
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ${REDIS_PASSWORD:+--no-auth-warning -a \"$REDIS_PASSWORD\"} ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ${REDIS_PASSWORD:+--no-auth-warning -a \"$REDIS_PASSWORD\"} ping | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    component: redis
