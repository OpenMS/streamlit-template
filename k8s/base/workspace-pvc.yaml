apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspaces-pvc
  annotations:
    # Argo CD: never prune or cascade-delete. On cinder-csi, deleting the claim
    # deletes the volume.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # One cinder volume, attached to one node. Every pod that mounts it is pinned
  # to the same memory-tier node by k8s/components/memory-tier-*, the layout
  # FLASHApp, quantms-web and OpenDIAKiosk use.
  accessModes:
    - ReadWriteOnce
  storageClassName: cinder-csi
  resources:
    requests:
      storage: 500Gi
