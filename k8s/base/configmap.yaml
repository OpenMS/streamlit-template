apiVersion: v1
kind: ConfigMap
metadata:
  name: streamlit-config
data:
  settings-overrides.json: |
    {
      "online_deployment": true,
      "demo_workspaces": {
        "enabled": true,
        "source_dirs": [
          "/app/example-data/workspaces",
          "/workspaces-streamlit-template/.demos"
        ],
        "save_dir": "/workspaces-streamlit-template/.demos"
      }
    }
