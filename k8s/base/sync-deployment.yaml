# Workspace sync service (src/sync/server.py): the offline desktop app pushes
# inputs into a workspace and pulls results through it, routed at /sync on the
# app's hosts. Its own Deployment, not a container of the streamlit pod: a
# multi-GB transfer neither competes with the app for the pod's resources nor
# is cut off when a streamlit pod restarts, and it scales on its own.
#
# It shares the workspaces volume (ReadWriteMany), and partial uploads live on
# that volume, so any replica can continue an upload another one began; the
# ingress routes it without session affinity. Unless workspace_sync.enabled is
# set it serves /sync/health only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync
  labels:
    component: sync
spec:
  replicas: 2
  selector:
    matchLabels:
      component: sync
  template:
    metadata:
      labels:
        component: sync
    spec:
      initContainers:
        # Hands the workspace volume to the app's user (uid 1000), once. The
        # app containers run as that user, and files written while they ran
        # as root are still root's. The top folder is chowned last, so its
        # owner says the hand-over is done and later starts only stat it; a
        # stat that does not answer (storage outage) skips the step rather
        # than holding the pod in Init. Only this container keeps root, with
        # the capabilities to change owners and nothing else. Both init
        # containers set requests == limits, so the rq-worker pod keeps
        # Guaranteed QoS.
        - name: own-workspaces
          image: openms-streamlit
          imagePullPolicy: Always
          securityContext:
            # Root, while the image itself runs as the app's user.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              root=/workspaces-streamlit-template
              owner=$(timeout 20 stat -c %u "$root") || exit 0
              [ "$owner" = 1000 ] && exit 0
              # A walk that fails or stalls exits non-zero with the top folder
              # still root's, so the container restarts and goes on with what
              # is left; the old pods keep serving meanwhile.
              timeout -k 10 1800 find "$root" -mindepth 1 ! -uid 1000 -exec chown -h 1000:1000 {} + || exit 1
              chown 1000:1000 "$root"
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces-streamlit-template
              mountPropagation: HostToContainer
        # settings.json of the image with the deployment's overrides, written
        # to a volume the app container mounts over /app/settings.json, so the
        # app's user needs no write access to /app.
        - name: settings
          image: openms-streamlit
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          command: ["/bin/sh", "-c"]
          args:
            - jq -s '.[0] * .[1]' /app/settings.json /app/settings-overrides.json > /settings/settings.json
          volumeMounts:
            - name: config
              mountPath: /app/settings-overrides.json
              subPath: settings-overrides.json
              readOnly: true
            - name: settings
              mountPath: /settings
      containers:
        - name: sync
          image: openms-streamlit
          imagePullPolicy: Always
          securityContext:
            # The app's user, not root: the image's TOPP tools and conda env
            # are readable by any user, and the workspace volume is handed to
            # uid 1000 by the own-workspaces init container.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              source /root/miniforge3/bin/activate streamlit-env
              exec python -m src.sync.server --port 8502
          ports:
            - containerPort: 8502
              name: sync
          env:
            # The desktop app starts and stops workflow runs through this
            # service, on the same queue the app's Run button uses.
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: WORKSPACES_DIR
              value: "/workspaces-streamlit-template"
            # Caches and config the tools write to their home folder.
            - name: HOME
              value: "/tmp"
          # Hashing and writing chunks to NFS is I/O-bound; memory stays small
          # because chunks are streamed to disk, never held whole.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces-streamlit-template
              # A FUSE volume (JuiceFS, components/storage-s3) whose mount
              # process restarted is mounted again on the node; HostToContainer
              # lets that new mount reach this running container instead of
              # leaving it on the dead one ("Transport endpoint is not
              # connected"). Harmless on NFS.
              mountPropagation: HostToContainer
            - name: config
              mountPath: /app/settings-overrides.json
              subPath: settings-overrides.json
              readOnly: true
            - name: settings
              mountPath: /app/settings.json
              subPath: settings.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /sync/health
              port: 8502
            initialDelaySeconds: 5
            periodSeconds: 10
          # The HTTP check as before, plus a restart when the workspace mount
          # is dead (ENOTCONN, a FUSE mount whose process died). Slow or
          # blocked NFS does not fail it: `--mount-alive` gives up on a stat
          # that does not answer within 5s and leaves that to readiness.
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  set -u
                  curl -fsS -m 5 -o /dev/null http://localhost:8502/sync/health || exit 1
                  timeout -k 3 15 /root/miniforge3/envs/streamlit-env/bin/python -m src.workflow.health --mount-alive
                  # Only exit 1 is a dead mount. An image older than these
                  # manifests does not know --mount-alive and exits 2: alive.
                  [ "$?" -ne 1 ]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 3
      volumes:
        - name: settings
          emptyDir: {}
        - name: workspaces
          persistentVolumeClaim:
            claimName: workspaces-manila-pvc
        - name: config
          configMap:
            name: streamlit-config
---
apiVersion: v1
kind: Service
metadata:
  name: sync
  labels:
    component: sync
spec:
  type: ClusterIP
  ports:
    - name: sync
      port: 8502
      targetPort: 8502
  selector:
    component: sync
