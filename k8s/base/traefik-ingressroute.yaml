apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: streamlit-traefik
spec:
  entryPoints:
    - web          #  301-redirects to websecure
    - websecure
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: streamlit
          port: 8501
          sticky:
            cookie:
              name: stroute
              httpOnly: true
              sameSite: lax
              secure: true   # only send the affinity cookie over HTTPS    # Workspace sync for the desktop app (src/sync/server.py). Kept after the
    # catch-all so overlays patching routes/0 still hit the app route; Traefik
    # ranks routes by rule length, so this longer rule wins for /sync. No
    # sticky cookie: uploads continue on any replica.
    - match: PathPrefix(`/sync`)
      kind: Rule
      services:
        - name: streamlit
          port: 8502
