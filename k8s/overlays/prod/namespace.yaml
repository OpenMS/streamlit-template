apiVersion: v1
kind: Namespace
metadata:
  name: openms
  annotations:
    # Argo CD (docs/kubernetes-deployment.md, "GitOps with Argo CD"): never
    # prune or cascade-delete this object. Every app on the cluster shares it,
    # so deleting the template's Application must not take the namespace with
    # it. Only the template's prod overlay includes this file.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/part-of: openms-streamlit
    # Pod Security: `warn` and `audit`, deliberately NOT `enforce`.
    #
    # This namespace is shared. `openms` can also hold other apps' pods that
    # are not deployed from this template, and an `enforce` label is a
    # namespace-wide admission rule, so stamping one from this repo's overlay
    # would police every pod of every co-tenant. A co-tenant pod using hostPath,
    # a privileged container or an added capability would start failing
    # admission on its next rollout, with nothing in its own manifests having
    # changed - and the failure would look like that app's problem.
    #
    # `warn` returns the same verdict to whoever runs `kubectl apply`, and
    # `audit` records it in the API server audit log, without blocking anyone.
    # That is the dry run this app can impose unilaterally. Turning it into
    # `enforce` is a cluster-owner decision, taken once every co-tenant's pods
    # are known clean - the audit log is the evidence for it.
    #
    # This app's own pods have nothing to lose either way: no securityContext,
    # no hostPath, no host namespaces and no added capabilities anywhere in
    # k8s/base or the overlay. The storage drivers, which do need more, run in
    # kube-system (k8s/storage/).
    #
    # The `-version` pins matter as much as the levels. Left off, the policy
    # tracks `latest` and silently tightens under a cluster upgrade; pinned, a
    # newer baseline is adopted by editing this file.
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: v1.28
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.28
