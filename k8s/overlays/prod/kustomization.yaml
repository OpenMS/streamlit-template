apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/memory-tier-low
  # Workspaces on S3 object storage (JuiceFS, k8s/storage-s3/) instead of
  # the Manila share. The size patch below still targets the Manila name;
  # the component renames the claim after it applies.
  - ../../components/storage-s3

namePrefix: template-app-

commonLabels:
  app: template-app

images:
  - name: openms-streamlit
    newName: ghcr.io/openms/streamlit-template
    # A release image, not the deployed one: under Argo CD the cluster's
    # ImageUpdater sets the latest release on the Application. This tag is only where a new Application starts and the
    # name CI loads its test image under, so it need not follow releases.
    newTag: v2.1.0-full

patches:
  # This app's values belong here, not in k8s/base or k8s/components: those
  # are template-owned and reach every app through the template sync. The
  # workspace share size is one such value (deploy.k8s.storage in app.yaml
  # must match it; `python -m utils.app_spec` compares them). Worker sizes
  # and counts are patched the same way, see docs/kubernetes-deployment.md.
  - target:
      kind: PersistentVolumeClaim
      name: workspaces-manila-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 50Gi
  - target:
      kind: IngressRoute
      name: streamlit-traefik
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: (Host(`template.webapps.openms.de`) || Host(`template.webapps.openms.org`)) && PathPrefix(`/`)
      - op: replace
        path: /spec/routes/0/services/0/name
        value: template-app-streamlit
      - op: replace
        path: /spec/routes/1/match
        value: (Host(`template.webapps.openms.de`) || Host(`template.webapps.openms.org`)) && PathPrefix(`/sync`)
      - op: replace
        path: /spec/routes/1/services/0/name
        value: template-app-sync
  - target:
      kind: Deployment
      name: streamlit
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "redis://template-app-redis:6379/0"
  - target:
      kind: Deployment
      name: sync
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "redis://template-app-redis:6379/0"
  - target:
      kind: Deployment
      name: rq-worker
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "redis://template-app-redis:6379/0"
