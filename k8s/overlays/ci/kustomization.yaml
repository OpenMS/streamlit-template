apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The production overlay with exactly one thing changed: the rq-worker is
# shrunk to a size a GitHub-hosted runner can schedule. APPLIED ONLY BY THE
# KIND JOBS in .github/workflows/build-and-test.yml - operators and every
# static assertion still use k8s/overlays/prod.
#
# k8s/components/memory-tier-low limits a worker to 16Gi / 4 cpu, which is
# right on the de.NBI nodes and more than a GitHub runner (4 vCPU, ~15.6Gi in
# total, shared by every kind node) can give next to the Streamlit pods, the
# ingress controller and kube-system.
#
# The `lint-manifests` job renders this root and checks that the worker really
# came out smaller than prod's, because kustomize does NOT error on a
# `patches:` entry whose target matches nothing - it renders happily and
# applies nothing.
resources:
  - ../prod

patches:
  - path: worker-resources.yaml
    target:
      kind: Deployment
      name: rq-worker
