apiVersion: apps/v1
kind: Deployment
metadata:
  name: rq-worker
spec:
  template:
    spec:
      containers:
        - name: rq-worker
          # The low tier's requests, used as the limit too: small enough to
          # leave the runner room for the Streamlit pods, the ingress
          # controller and kube-system on one physical 4-cpu host.
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "500m"
