# Argo CD project of `streamlit-template-argocd` (argocd-application.yaml),
# which syncs k8s/argocd/: only this repository, only the argocd namespace,
# and only the kinds the folder holds (the Applications and the
# ImageUpdater). Nothing else can be deployed through it, and no project.
#
# Applied by an admin (k8s/argocd-projects/kustomization.yaml), never synced
# from git.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: streamlit-template-argocd
  namespace: argocd
spec:
  description: Argo CD resources of streamlit-template, synced from k8s/argocd
  sourceRepos:
    - https://github.com/OpenMS/streamlit-template.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argocd-image-updater.argoproj.io
      kind: ImageUpdater
