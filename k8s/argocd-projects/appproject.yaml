# Argo CD project of this app's Application (application.yaml): what the
# prod overlay may deploy. Only this repository, only the `openms`
# namespace on this cluster, and no RBAC, so a change to the overlay cannot
# reach other namespaces, the cluster or Argo CD itself.
#
# The one cluster-scoped kind is the shared `openms` Namespace, which only
# the template's own deployment manages (k8s/overlays/prod/namespace.yaml).
# An app generated from the template deletes that file, and with it the
# clusterResourceWhitelist entry below.
#
# Applied by an admin (k8s/argocd-projects/kustomization.yaml), never synced
# from git: a merge cannot widen what the app may deploy.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: streamlit-template
  namespace: argocd
spec:
  description: streamlit-template, deployed from k8s/overlays/prod
  sourceRepos:
    - https://github.com/OpenMS/streamlit-template.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: openms
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: "*"
