apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Workspaces live on one ReadWriteOnce cinder volume (k8s/base/workspace-pvc.yaml),
# which attaches to a single node. Every pod that mounts it - all Deployments
# and the cleanup CronJob - is therefore pinned to the high memory-tier node, the
# same layout FLASHApp, quantms-web and OpenDIAKiosk use.
patches:
  - path: nodeselector.yaml
    target:
      kind: Deployment
  - path: cronjob-nodeselector.yaml
    target:
      kind: CronJob
  - path: streamlit-resources.yaml
    target:
      kind: Deployment
      name: streamlit
  - path: worker-resources.yaml
    target:
      kind: Deployment
      name: rq-worker
